<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mirrors components/OrbitMark.tsx — a standalone favicon file has no
       access to the page's CSS variables, so --brand-a / --brand-b from
       app/globals.css are duplicated here as literals. Keep both in sync. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b1fa2"/>
      <stop offset="1" stop-color="#311b92"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#07060c"/>
  <ellipse cx="16" cy="16" rx="14.5" ry="5.2" fill="none" stroke="url(#g)" stroke-width="2.1" transform="rotate(-20 16 16)"/>
  <circle cx="16" cy="16" r="8.5" fill="url(#g)"/>
</svg>
