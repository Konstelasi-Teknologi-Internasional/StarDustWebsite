name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow does NOT deploy. Its job is to prove the build is sound and to
# hand you the exact folder that gets published.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Downloadable from the run's summary page, so publishing never requires
      # building locally.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 14
